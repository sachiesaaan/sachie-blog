name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: "cf-pages-deploy"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.PAT }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Quartz plugins
        run: npx quartz plugin install --from-config

      - name: Cache optimized images
        uses: actions/cache@v4
        with:
          path: .quartz-cache/optimized-images
          key: optimized-images-${{ hashFiles('quartz/plugins/emitters/optimizeImage.ts') }}-${{ github.run_id }}
          restore-keys: |
            optimized-images-${{ hashFiles('quartz/plugins/emitters/optimizeImage.ts') }}-

      - name: Build
        run: npx quartz build

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy public --project-name=sachie-blog --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
